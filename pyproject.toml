[project]
name = "k8s-ai-ops-agent"
version = "0.1.0"
description = "Enterprise Agentic AI platform for Kubernetes incident investigation and remediation"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",

    "langchain",
    "langgraph",
    "langchain-openai",
    "langchain-ollama",
    "langchain-aws",

    "boto3",
    "kubernetes",
    "httpx",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]